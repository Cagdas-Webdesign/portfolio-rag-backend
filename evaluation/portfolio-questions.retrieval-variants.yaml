      - document: fullstack-web-development
        section: Frontend Development
  - id: scroll-pronoun
    category: direct
    question: Welche Technologie nutzt er für scrollbasierte Animationen?
    expected_sources: *scroll
  - id: motion-name
    category: paraphrased
    question: Welche Tools nutzt Çağdaş für Motion Design?
