# Retrieval variants — one intent, several wordings (2026-10-11).
#
# Diagnostic only, scored separately from the release-acceptance suite and the
# retrieval probes; neither of those is changed or extended by this file. Each
# group asks one intent with the subject named ("Çağdaş"), as a pronoun ("er")
# or impersonally, and some with synonyms ("künstliche Intelligenz" next to
# "KI", "Scroll-Animationen" next to the paraphrase the frozen suite uses).
# Ids share a group prefix; the suffix names the wording:
#
#   -name     names Çağdaş        -pronoun   "er" / "sein"
#   -neutral  no person at all    -synonym   the same intent in other words
#
# Ground truth follows the dataset convention: a section counts when, read
# alone, it helps answer the question; the first one is the primary evidence.
# Within a group every wording expects the same sources, so a rank difference
# inside a group is caused by the wording and nothing else.

version: 1
corpus: ../knowledge

questions:
  # --- AI technologies ---------------------------------------------------------
  - id: ai-tech-name
    category: multi_source
    question: Welche KI-Technologien nutzt Çağdaş?
    expected_sources: &ai_tech
      - document: professional-profile
        section: AI and RAG Development
      - document: custom-rag-backend
        section: Technologie-Stack
      - document: fullstack-web-development
        section: Backend Development
      - document: portfolio-capabilities-and-evidence
        section: API- und Systemintegration
  - id: ai-tech-pronoun
    category: multi_source
    question: Welche KI-Technologien nutzt er?
    expected_sources: *ai_tech
  - id: ai-tech-neutral
    category: multi_source
    question: Welche KI-Technologien werden im Portfolio-Backend eingesetzt?
    expected_sources: *ai_tech
  - id: ai-tech-synonym
    category: paraphrased
    question: Welche Technologien für künstliche Intelligenz setzt Çağdaş ein?
    expected_sources: *ai_tech

  # --- frontend, backend and AI together ---------------------------------------------
  - id: stack-connect-name
    category: multi_source
    question: Wie verbindet Çağdaş Frontend, Backend und KI?
    expected_sources: &stack_connect
      - document: portfolio-capabilities-and-evidence
        section: Full-Stack als Gesamtzusammenhang
      - document: fullstack-web-development
        section: Backend Development
      - document: api-backend-databases
        section: Positionierung
      - document: react-portfolio
        section: Portfolio Assistant Integration
      - document: react-portfolio
        section: Trennung der Projekte
  - id: stack-connect-synonym
    category: multi_source
    question: Wie verbindet Çağdaş Frontend, Backend und künstliche Intelligenz?
    expected_sources: *stack_connect
  - id: stack-connect-neutral
    category: multi_source
    question: Wie arbeiten Frontend, Backend und KI im Portfolio zusammen?
    expected_sources: *stack_connect

  # --- scroll and motion -----------------------------------------------------------
  - id: scroll-name
    category: direct
    question: Womit setzt Çağdaş Scroll-Animationen um?
