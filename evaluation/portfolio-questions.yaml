# Evaluation dataset v1 — the real portfolio corpus (`knowledge/`).
#
# Separate from `questions.yaml`, which measures the neutral fixture corpus in
# `corpus/` and is left untouched. Two datasets, two corpora, two purposes: the
# fixture set proves the pipeline and the ground truth; this one asks how well
# the system answers questions about a real person.
#
# Ground truth is a document id plus, where the question is section-specific, a
# section heading — never a chunk id. Every entry is checkable by hand against
# `../knowledge/`.
#
# Categories are the ones the schema defines
# (`portfolio_rag.evaluation.dataset.QuestionCategory`); the topic groups a
# reader might expect (WordPress, RAG, automation, …) are spread across them
# rather than being categories of their own, because the category decides how a
# question is *scored*, not what it is about.
#
#   direct       the answer is stated plainly in one place
#   paraphrased  the question shares little vocabulary with the passage
#   multi_source several documents are legitimately relevant
#   section      the right answer is one specific section, not the document
#   ambiguous    near-matches exist in other documents — measured on purpose
#   unknown      the corpus cannot answer it; no source is expected
#
# Two schema categories are deliberately unused here:
#   internal     the real corpus has no `internal` document — all 12 are public,
#                so there is nothing for such a question to be refused from.
#   adversarial  reserved for prompt-injection bait. The one adversarially
#                *phrased* question below (`section-degree-claim`) is not that:
#                it is a leading question the corpus answers explicitly, so it
#                is scored like any other answerable question.

# Ground truth completeness audit, 2026-08-26: 24 questions gained one or more
# expected sources. This corpus states the same fact in several documents on
# purpose — a profile, a skill and a project document legitimately describe the
# same technology — so naming a single section per question understated what a
# correct retrieval looks like. Every source added was decided by reading the
# corpus and asking whether that section, read alone, answers the question;
# none was added because retrieval happened to return it. Consequence: hit
# rates and MRR measured after this audit are NOT comparable with numbers
# measured before it.
#
# Ground truth audit, 2026-10-01, after the first production retrieval run:
# two questions gained one expected source each — `broad-system-flow`
# (custom-rag-backend › End-to-End-Systemablauf) and `multi-frontend-backend-ai`
# (react-portfolio › Positionierung). Same test as above: the section, read
# alone, answers the question. Considered and not added:
# fullstack-web-development › Motion und Web Animation for
# `paraphrased-scroll-animation` (names GSAP and Framer Motion without saying
# which one drives scroll or timeline animation), and api-backend-databases ›
# Positionierung for `multi-frontend-backend-ai` (a general statement about
# connecting systems; it does not describe the portfolio or name AI). Numbers
# measured before this audit are NOT comparable with numbers measured after it.

