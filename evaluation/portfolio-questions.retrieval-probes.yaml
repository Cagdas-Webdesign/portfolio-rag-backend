# Retrieval probes — diagnostic questions for the real portfolio corpus.
#
# NOT a release suite. The release-acceptance suite and `portfolio-questions.yaml`
# stay frozen; nothing here changes what a release acceptance asks or gates.
# These questions cover what the 2026-10-11 retrieval audit found the frozen
# set does not: project overviews, AI-technology questions, services, social
# media, and several wordings of one intent. Retrieval only:
#
#   uv run portfolio-rag eval run --dataset evaluation/portfolio-questions.retrieval-probes.yaml \
#     --retrieval-only --top-k 30 --min-similarity -1 --output evaluation/results/<name>.json
#
# Ground truth follows the dataset convention: a section counts when, read
# alone, it helps answer the question. **The first expected source of each
# question is its primary evidence**; the rest are supplementary. Sections are
# named by an inner heading, never by a document title — a title is in every
# chunk's heading path and would make the whole document count.
#
# `professional-profile › Projekte im Überblick` is expected by the project
# questions although it does not exist in the corpus before 2026-10-11: it is
# the overview the audit found missing (finding F4). A run before it exists
# cannot find it, and that is the measurement.

version: 1
corpus: ../knowledge

